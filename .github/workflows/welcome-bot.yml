name: Welcome New Contributors
on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - name: Welcome Comment
        uses: actions/github-script@v7
        with:
          script: |
            const creator = context.payload.sender.login;
            const type = context.payload.issue ? 'issue' : 'pull request';
            const body = `👋 Welcome to the GDGoC LGU Open Source Community, @${creator}!\n\nThank you for opening your very first ${type} here. Our Core Team will review this shortly. In the meantime, make sure you've joined our [Discord Server](#) and introduced yourself! 🚀`;
            
            // Check if this is their first time contributing
            const response = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              creator: creator,
              state: 'all'
            });
            
            if (response.data.length === 1) {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }

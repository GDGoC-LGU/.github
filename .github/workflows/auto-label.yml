name: Auto-Label PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      
    steps:
      - name: Auto-Label Based on Files Changed
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            
            // 1. Fetch the list of files changed in this PR
            const { data: files } = await github.rest.pulls.listFiles({
              owner,
              repo,
              pull_number: prNumber
            });
            
            const fileNames = files.map(file => file.filename);
            const labelsToAdd = new Set();
            
            // 2. Our custom rules (add as many as you want here!)
            if (fileNames.some(f => f.endsWith('.md'))) {
              labelsToAdd.add('Documentation');
            }
            if (fileNames.some(f => f.endsWith('package.json') || f.endsWith('package-lock.json'))) {
              labelsToAdd.add('Dependencies');
            }
            if (fileNames.some(f => f.endsWith('.css') || f.endsWith('.html') || f.endsWith('.js'))) {
              labelsToAdd.add('UI/UX');
            }
            
            // 3. Apply the labels if any rules matched
            if (labelsToAdd.size > 0) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: prNumber,
                labels: Array.from(labelsToAdd)
              });
              console.log('Successfully added labels:', Array.from(labelsToAdd));
            } else {
              console.log('No labels needed for these files.');
            }

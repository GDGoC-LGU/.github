name: Auto-Label PRs

# Changed from pull_request_target to pull_request
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      
    steps:
    - name: Run Labeler
      uses: actions/labeler@v5
      with:
        repo-token: "${{ secrets.GITHUB_TOKEN }}"
        # Forcing the bot to look at this exact path, no guessing!
        configuration-path: '.github/labeler.yml'
        sync-labels: true
